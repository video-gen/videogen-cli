# Publishes the `videogen` Homebrew formula to video-gen/homebrew-tap after each
# release, so `brew install video-gen/tap/videogen` works.
#
# This file is OWNED BY THE MONOREPO (api/sdks/cli/.github/workflows/). It is
# pushed into this repo by `pnpm --filter api run generate:sdk:custom-code:cli`
# and listed in .fernignore so Fern preserves it across regeneration. Do not
# edit it here — edit it in the monorepo and regenerate.
#
# fern-cli's generated "Release" workflow (cargo-dist) builds the per-platform
# archives and creates the GitHub Release, but it has no Homebrew-publish job.
# The Release is created with the default GITHUB_TOKEN, which cannot trigger
# another workflow, so this runs off `workflow_run` after "Release" succeeds
# (not `release: published`, which would never fire).
#
# One-time manual setup in this repo's settings:
#   Add a `HOMEBREW_TAP_TOKEN` secret — a fine-grained or classic PAT with
#   contents:write on video-gen/homebrew-tap.

name: Publish Homebrew formula

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.2.3)
        required: true

permissions:
  contents: read

jobs:
  publish-homebrew-formula:
    # For workflow_run, only proceed when the Release workflow succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: rel
        env:
          # For tag-triggered runs, workflow_run.head_branch is the tag name.
          TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "Could not resolve a release tag." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download release archives and compute checksums
        id: sums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          # cargo-dist names archives "<binary>-<target-triple>.tar.gz". If that
          # naming ever changes upstream, update these targets.
          declare -A TARGETS=(
            [arm_macos]=aarch64-apple-darwin
            [intel_macos]=x86_64-apple-darwin
            [arm_linux]=aarch64-unknown-linux-gnu
            [intel_linux]=x86_64-unknown-linux-gnu
          )
          for key in "${!TARGETS[@]}"; do
            asset="videogen-${TARGETS[$key]}.tar.gz"
            gh release download "$TAG" --repo "$REPO" --pattern "$asset" --dir . --clobber
            sum="$(shasum -a 256 "$asset" | cut -d' ' -f1)"
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
          done

      - name: Render formula
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.rel.outputs.tag }}
          VERSION: ${{ steps.rel.outputs.version }}
          ARM_MACOS: ${{ steps.sums.outputs.arm_macos }}
          INTEL_MACOS: ${{ steps.sums.outputs.intel_macos }}
          ARM_LINUX: ${{ steps.sums.outputs.arm_linux }}
          INTEL_LINUX: ${{ steps.sums.outputs.intel_linux }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/${TAG}"
          mkdir -p rendered/Formula
          cat > rendered/Formula/videogen.rb <<EOF
          class Videogen < Formula
            desc "Official command-line interface for the VideoGen API"
            homepage "https://videogen.io"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "${base}/videogen-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_MACOS}"
              end
              on_intel do
                url "${base}/videogen-x86_64-apple-darwin.tar.gz"
                sha256 "${INTEL_MACOS}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/videogen-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${ARM_LINUX}"
              end
              on_intel do
                url "${base}/videogen-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${INTEL_LINUX}"
              end
            end

            def install
              bin.install "videogen"
            end

            test do
              system "#{bin}/videogen", "--version"
            end
          end
          EOF
          echo "Rendered formula:"
          cat rendered/Formula/videogen.rb

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: video-gen/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit and push formula
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp rendered/Formula/videogen.rb tap/Formula/videogen.rb
          cd tap
          git config user.name "videogen-bot"
          git config user.email "bot@videogen.io"
          if git diff --quiet -- Formula/videogen.rb; then
            echo "Formula already up to date; nothing to publish."
            exit 0
          fi
          git add Formula/videogen.rb
          git commit -m "videogen ${VERSION}"
          git push
